dependencies = [
    "anthropic>=0.120.2",
    "claude>=0.4.11",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "duckdb",
    "gensim>=4.4.0",
    "ipykernel",
    "kagglehub",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "matplotlib",
    "numpy>=2.0,<2.2",
    "openai",
    "pandas>=2.2",
    "pandas-stubs",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "scikit-learn",
    "scipy",
    "seaborn",
    "streamlit",
